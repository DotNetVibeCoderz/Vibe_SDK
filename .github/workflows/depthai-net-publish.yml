# Rilis DepthAI.Net ke nuget.org.
#
# Pemicu:
#   - tag  depthai-net-v0.1.0  (awalan dibuang, sisanya jadi versi paket)
#   - jalankan manual lewat tab Actions dengan mengisi input `version`
#
# Tag sengaja diberi awalan nama SDK, bukan `v*` polos: Vibe_SDK memuat beberapa
# SDK, dan tag rilis Unitree.Net tidak boleh ikut mempublish paket DepthAI.
#
# Butuh secret repository: NUGET_API_KEY (API key dari nuget.org).
name: DepthAI.Net Publish NuGet

on:
  push:
    tags:
      - 'depthai-net-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi paket, mis. 0.1.0 atau 0.2.0-beta.1'
        required: true
        type: string
      dry_run:
        description: 'Pack saja, jangan push ke nuget.org'
        required: false
        default: false
        type: boolean

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # depthai-core tidak punya rilis C++ prebuilt untuk Linux, jadi dibangun dari sumber.
  # Ubuntu 22.04 (glibc 2.35) supaya pustakanya jalan di distro yang lebih lama juga.
  # Build pertama memakan puluhan menit; hasil install di-cache berdasarkan isi build.sh.
  native-linux:
    name: Runtime native linux-x64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Temukan folder SDK
        id: sdk
        shell: bash
        run: |
          slnx=$(find . -name 'DepthAI.Net.slnx' -not -path '*/bin/*' -not -path '*/obj/*' -not -path '*/.vs/*' | sort | head -n 1)
          if [ -z "$slnx" ]; then echo "DepthAI.Net.slnx tidak ditemukan"; exit 1; fi
          echo "dir=$(dirname "$slnx")" >> "$GITHUB_OUTPUT"

      - name: Pasang toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 pkg-config libudev-dev patchelf zip unzip \
            autoconf automake autoconf-archive libtool

      - name: Cache depthai-core
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.dir }}/native/depthai-c/.deps/depthai-core-*-linux-x64
          key: depthai-core-linux-x64-${{ hashFiles('**/native/depthai-c/build.sh') }}

      - name: Bangun runtime native linux-x64
        working-directory: ${{ steps.sdk.outputs.dir }}
        env:
          CC: gcc-12
          CXX: g++-12
        run: bash native/depthai-c/build.sh

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ steps.sdk.outputs.dir }}/global.json

      # Probe native tidak butuh kamera: ini menangkap pustaka yang hilang atau ABI yang
      # tidak cocok sebelum paket dirilis.
      - name: Periksa runtime native termuat
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: |
          out=$(dotnet run --project src/DepthAI.Net.Cli -c Release -- info)
          echo "$out"
          echo "$out" | grep -q "(depthai-core [0-9]" || { echo "Runtime native tidak termuat"; exit 1; }

      - name: Unggah runtime linux-x64
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: ${{ steps.sdk.outputs.dir }}/artifacts/native/linux-x64
          if-no-files-found: error

  publish:
    name: Pack & push
    # Windows: DepthAI.Net.Imaging.SystemDrawing menargetkan net10.0-windows.
    needs: native-linux
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Source Link butuh riwayat commit untuk menautkan sumber.

      - name: Temukan folder SDK
        id: sdk
        shell: bash
        run: |
          slnx=$(find . -name 'DepthAI.Net.slnx' -not -path '*/bin/*' -not -path '*/obj/*' -not -path '*/.vs/*' | sort | head -n 1)
          if [ -z "$slnx" ]; then echo "DepthAI.Net.slnx tidak ditemukan"; exit 1; fi
          echo "dir=$(dirname "$slnx")" >> "$GITHUB_OUTPUT"
          echo "slnx=$(basename "$slnx")" >> "$GITHUB_OUTPUT"

      - name: Tentukan versi
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#depthai-net-v}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Versi tidak valid: '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Merilis versi $version"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ steps.sdk.outputs.dir }}/global.json

      # Runtime Linux dibangun di job native-linux; diletakkan di tempat yang sama dengan
      # hasil build.sh supaya proyek runtime linux-x64 dan tool CLI ikut membawanya.
      - name: Ambil runtime linux-x64
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: ${{ steps.sdk.outputs.dir }}/artifacts/native/linux-x64

      # Harus sebelum build: Core menyalin DLL native ke CLI, dan proyek runtime
      # hanya bisa di-pack bila artifacts/native/win-x64 sudah terisi.
      - name: Bangun runtime native win-x64
        working-directory: ${{ steps.sdk.outputs.dir }}
        shell: pwsh
        run: ./native/depthai-c/build.ps1

      - name: Restore
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: dotnet restore ${{ steps.sdk.outputs.slnx }}

      - name: Build
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: dotnet build ${{ steps.sdk.outputs.slnx }} -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: dotnet test ${{ steps.sdk.outputs.slnx }} -c Release --no-build -p:Version=${{ steps.ver.outputs.version }}

      - name: Pack
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: dotnet pack ${{ steps.sdk.outputs.slnx }} -c Release --no-build -p:Version=${{ steps.ver.outputs.version }}

      - name: Pastikan paket runtime native ikut
        working-directory: ${{ steps.sdk.outputs.dir }}
        shell: bash
        run: |
          for rid in win-x64 linux-x64; do
            ls artifacts/nuget/DepthAI.Net.Runtime.$rid.${{ steps.ver.outputs.version }}.nupkg               || { echo "Paket DepthAI.Net.Runtime.$rid tidak terbentuk"; exit 1; }
          done

      - name: Unggah paket sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.sdk.outputs.dir }}/artifacts/nuget/*.nupkg
            ${{ steps.sdk.outputs.dir }}/artifacts/nuget/*.snupkg
          if-no-files-found: error

      # --skip-duplicate: rilis ulang setelah kegagalan sebagian tidak berhenti
      # hanya karena satu paket sudah terlanjur masuk ke nuget.org.
      - name: Push ke nuget.org
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: ${{ steps.sdk.outputs.dir }}
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Secret NUGET_API_KEY belum diset di repository ini."; exit 1
          fi
          # Glob diekspansi bash: di runner Windows dotnet nuget push tidak me-resolve "artifacts/nuget/*.nupkg".
          # Paket .snupkg di sebelahnya ikut terunggah otomatis oleh push .nupkg.
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
