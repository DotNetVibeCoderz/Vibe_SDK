# CI DepthAI.Net — build, uji, dan pack setiap perubahan.
#
# Vibe_SDK adalah monorepo (DepthAI.Net, Unitree.Net, ...), jadi workflow ini
# dibatasi ke subfolder DepthAI.Net saja: perubahan di SDK lain tidak memicunya.
# Langkah "Temukan folder SDK" mencari DepthAI.Net.slnx sehingga jalur build
# tetap benar walau foldernya kelak dipindah atau diganti nama.
name: DepthAI.Net CI

on:
  push:
    branches: [ main ]
    paths:
      - 'DepthAI.Net/**'
      - '.github/workflows/depthai-net-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'DepthAI.Net/**'
      - '.github/workflows/depthai-net-ci.yml'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Temukan folder SDK
        id: sdk
        shell: bash
        run: |
          slnx=$(find . -name 'DepthAI.Net.slnx' -not -path '*/bin/*' -not -path '*/obj/*' -not -path '*/.vs/*' | sort | head -n 1)
          if [ -z "$slnx" ]; then echo "DepthAI.Net.slnx tidak ditemukan"; exit 1; fi
          echo "dir=$(dirname "$slnx")" >> "$GITHUB_OUTPUT"
          echo "slnx=$(basename "$slnx")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ steps.sdk.outputs.dir }}/global.json

      - name: Cache paket NuGet
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ matrix.os }}-

      - name: Restore
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: dotnet restore ${{ steps.sdk.outputs.slnx }}

      - name: Build
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: dotnet build ${{ steps.sdk.outputs.slnx }} -c Release --no-restore

      - name: Test
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: dotnet test ${{ steps.sdk.outputs.slnx }} -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./artifacts/test-results

      - name: Unggah hasil uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ steps.sdk.outputs.dir }}/artifacts/test-results/**/*.trx
          if-no-files-found: ignore

  # depthai-core tidak punya rilis C++ prebuilt untuk Linux, jadi dibangun dari sumber,
  # native di arsitektur target (runner ARM64 GitHub, bukan cross-compile).
  # Ubuntu 22.04 (glibc 2.35) supaya pustakanya jalan di distro yang lebih lama juga.
  # Build pertama memakan belasan menit; hasil install di-cache berdasarkan isi build.sh.
  native-linux:
    name: Runtime native ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: linux-arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Temukan folder SDK
        id: sdk
        shell: bash
        run: |
          slnx=$(find . -name 'DepthAI.Net.slnx' -not -path '*/bin/*' -not -path '*/obj/*' -not -path '*/.vs/*' | sort | head -n 1)
          if [ -z "$slnx" ]; then echo "DepthAI.Net.slnx tidak ditemukan"; exit 1; fi
          echo "dir=$(dirname "$slnx")" >> "$GITHUB_OUTPUT"

      - name: Pasang toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 pkg-config libudev-dev patchelf zip unzip \
            autoconf automake autoconf-archive libtool cmake curl

      - name: Cache depthai-core
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.dir }}/native/depthai-c/.deps/depthai-core-*-${{ matrix.rid }}
          key: depthai-core-${{ matrix.rid }}-${{ hashFiles('**/native/depthai-c/build.sh') }}

      - name: Bangun runtime native ${{ matrix.rid }}
        working-directory: ${{ steps.sdk.outputs.dir }}
        env:
          CC: gcc-12
          CXX: g++-12
        run: bash native/depthai-c/build.sh

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ steps.sdk.outputs.dir }}/global.json

      # Probe native tidak butuh kamera: ini menangkap pustaka yang hilang atau ABI yang
      # tidak cocok sebelum paket dirilis.
      - name: Periksa runtime native termuat
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: |
          out=$(dotnet run --project src/DepthAI.Net.Cli -c Release -- info)
          echo "$out"
          echo "$out" | grep -q "(depthai-core [0-9]" || { echo "Runtime native tidak termuat"; exit 1; }

      - name: Unggah runtime ${{ matrix.rid }}
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: ${{ steps.sdk.outputs.dir }}/artifacts/native/${{ matrix.rid }}
          if-no-files-found: error

  pack:
    name: Pack
    needs: [build, native-linux]
    # Pack di Windows: DepthAI.Net.Imaging.SystemDrawing menargetkan net10.0-windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Temukan folder SDK
        id: sdk
        shell: bash
        run: |
          slnx=$(find . -name 'DepthAI.Net.slnx' -not -path '*/bin/*' -not -path '*/obj/*' -not -path '*/.vs/*' | sort | head -n 1)
          echo "dir=$(dirname "$slnx")" >> "$GITHUB_OUTPUT"
          echo "slnx=$(basename "$slnx")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ steps.sdk.outputs.dir }}/global.json

      # Runtime Linux dibangun di job native-linux; diletakkan di tempat yang sama dengan
      # hasil build.sh supaya proyek runtime Linux dan tool CLI ikut membawanya.
      - name: Ambil runtime linux-x64
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: ${{ steps.sdk.outputs.dir }}/artifacts/native/linux-x64

      - name: Ambil runtime linux-arm64
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: ${{ steps.sdk.outputs.dir }}/artifacts/native/linux-arm64

      # Shim native depthai-c: dibangun di atas depthai-core prebuilt. Unduhan (~270 MB)
      # di-cache berdasarkan isi skrip, karena versi dependensi ditetapkan di sana.
      - name: Cache dependensi native
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.dir }}/native/depthai-c/.deps
          key: depthai-native-deps-${{ hashFiles('**/native/depthai-c/build.ps1') }}

      - name: Bangun runtime native win-x64
        working-directory: ${{ steps.sdk.outputs.dir }}
        shell: pwsh
        run: ./native/depthai-c/build.ps1

      # Tanpa kamera pun probe native harus berhasil: ini menangkap DLL yang hilang
      # atau ABI yang tidak cocok sebelum paket dirilis.
      - name: Periksa runtime native termuat
        working-directory: ${{ steps.sdk.outputs.dir }}
        shell: bash
        run: |
          out=$(dotnet run --project src/DepthAI.Net.Cli -c Release -- info)
          echo "$out"
          # Spectre menyisipkan kode warna ANSI setelah "tersedia", jadi yang dicocokkan
          # versi depthai-core, yang hanya tampil bila pustaka native termuat.
          echo "$out" | grep -q "(depthai-core [0-9]" || { echo "Runtime native tidak termuat"; exit 1; }

      # Build CI memakai nomor build sebagai suffix prerelease supaya paket dari
      # main tidak pernah bentrok dengan rilis stabil di nuget.org.
      - name: Pack
        working-directory: ${{ steps.sdk.outputs.dir }}
        run: dotnet pack ${{ steps.sdk.outputs.slnx }} -c Release --version-suffix "ci.${{ github.run_number }}"

      - name: Unggah paket
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ${{ steps.sdk.outputs.dir }}/artifacts/nuget/*.nupkg
            ${{ steps.sdk.outputs.dir }}/artifacts/nuget/*.snupkg
          if-no-files-found: error

  # Memakai paket hasil pack persis seperti pengguna: aplikasi baru yang hanya punya
  # PackageReference, dan tool CLI yang di-install. Ini menguji jalur yang tidak tersentuh
  # build di dalam repo — runtimes/<rid>/native di paket dan RUNPATH $ORIGIN di Linux.
  verify-packages:
    name: Uji paket (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-22.04-arm, windows-latest ]

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: feed

      - name: Aplikasi konsumen memuat runtime native
        shell: bash
        run: |
          version=$(ls feed/DepthAI.Net.Runtime.linux-x64.*.nupkg | sed -E 's/.*linux-x64\.(.*)\.nupkg/\1/')
          case "$RUNNER_OS-$(uname -m)" in
            Windows-*) rid=win-x64 ;;
            Linux-aarch64) rid=linux-arm64 ;;
            *) rid=linux-x64 ;;
          esac
          mkdir consumer && cd consumer
          cat > nuget.config <<XML
          <configuration><packageSources>
            <add key="local" value="$GITHUB_WORKSPACE/feed" />
          </packageSources></configuration>
          XML
          cat > consumer.csproj <<XML
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="DepthAI.Net" Version="$version" />
              <PackageReference Include="DepthAI.Net.Runtime.$rid" Version="$version" />
            </ItemGroup>
          </Project>
          XML
          cat > Program.cs <<'CS'
          using DepthAI.Interop;
          System.Console.WriteLine($"native={NativeRuntime.IsAvailable} version={NativeRuntime.Version} reason={NativeRuntime.UnavailableReason}");
          return NativeRuntime.IsAvailable ? 0 : 1;
          CS
          dotnet run -c Release

      - name: Tool CLI memuat runtime native
        shell: bash
        run: |
          version=$(ls feed/DepthAI.Net.Cli.*.nupkg | sed -E 's/.*Cli\.(.*)\.nupkg/\1/')
          dotnet tool install DepthAI.Net.Cli --version "$version" --tool-path tool --add-source feed
          out=$(./tool/depthai-dotnet-cli info)
          echo "$out"
          echo "$out" | grep -q "(depthai-core [0-9]" || { echo "Runtime native tidak termuat"; exit 1; }
