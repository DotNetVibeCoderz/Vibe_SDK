name: CI

# The two WPF shells (Simulator, Wizard) target net10.0-windows10.0.19041.0, so the full solution
# only restores on Windows. Linux builds every cross-platform project instead — that is the
# deployment target (Ubuntu on x86_64 and ARM), so it has to stay green.

on:
  push:
    branches: [main]
    paths:
      - 'Unitree.Net/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Unitree.Net/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  # Path from the repository root to this SDK. The workflow lives at the root of DotNetVibeCoderz/
  # Vibe_SDK, where the SDK sits in a subfolder; set this to '.' if the SDK is ever its own repo.
  PROJECT_DIR: Unitree.Net
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  windows:
    name: Build + test (Windows, full solution)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ env.PROJECT_DIR }}/global.json

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_DIR }}/Unitree.Net.slnx

      - name: Build
        run: dotnet build ${{ env.PROJECT_DIR }}/Unitree.Net.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.PROJECT_DIR }}/Unitree.Net.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ${{ env.PROJECT_DIR }}/artifacts/test-results

      # Reported, not enforced: the tree currently has IDE1006 violations in Unitree.Net.Wizard.Core,
      # so a hard gate would start red. Drop continue-on-error once `dotnet format` is clean.
      - name: Verify formatting
        continue-on-error: true
        run: dotnet format ${{ env.PROJECT_DIR }}/Unitree.Net.slnx --verify-no-changes --no-restore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: ${{ env.PROJECT_DIR }}/artifacts/test-results/**/*.trx

  linux:
    name: Build + test (Linux, cross-platform projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ env.PROJECT_DIR }}/global.json

      # Everything except apps/Unitree.Net.Simulator and apps/Unitree.Net.Wizard, which are WPF.
      - name: Build cross-platform projects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(
            find "$PROJECT_DIR/src" "$PROJECT_DIR/apps" "$PROJECT_DIR/samples" "$PROJECT_DIR/tools" \
                 "$PROJECT_DIR/tests" -name '*.csproj' \
              | grep -v 'Unitree.Net.Simulator' \
              | grep -v 'apps/Unitree.Net.Wizard/' \
              | sort
          )
          printf 'Building %d projects\n' "${#projects[@]}"
          for p in "${projects[@]}"; do
            echo "::group::$p"
            dotnet build "$p" -c Release
            echo "::endgroup::"
          done

      - name: Test
        run: dotnet test ${{ env.PROJECT_DIR }}/tests/Unitree.Net.Tests/Unitree.Net.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ${{ env.PROJECT_DIR }}/artifacts/test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: ${{ env.PROJECT_DIR }}/artifacts/test-results/**/*.trx

  templates:
    name: Wizard template catalogue
    runs-on: ubuntu-latest
    # The 16 templates are hand-written against the SDK's public surface and nothing recompiles them
    # by accident. This is the only thing that catches drift after a public API change.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ env.PROJECT_DIR }}/global.json

      - name: Scaffold and compile every template
        run: dotnet run --project ${{ env.PROJECT_DIR }}/tools/Unitree.Net.TemplateCheck -c Release

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: [linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ env.PROJECT_DIR }}/global.json

      # Packing goes project by project for the same reason the Linux build does: the solution
      # contains Windows-only projects. Every packable project is under src/.
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          for p in "$PROJECT_DIR"/src/*/*.csproj; do
            dotnet pack "$p" -c Release
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ${{ env.PROJECT_DIR }}/artifacts/packages/*.nupkg
            ${{ env.PROJECT_DIR }}/artifacts/packages/*.snupkg
          if-no-files-found: error

  native:
    name: Native Cyclone DDS shim
    runs-on: ubuntu-latest
    # Not part of dotnet build. Real hardware needs it, so a compile break here must not wait for
    # someone to try it on a robot.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyclone DDS
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcyclonedds-dev || echo "cyclonedds not packaged on this runner"

      - name: Configure and build
        run: |
          cmake -S ${{ env.PROJECT_DIR }}/native/unitree_net_native -B ${{ env.PROJECT_DIR }}/native/unitree_net_native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{ env.PROJECT_DIR }}/native/unitree_net_native/build --config Release
